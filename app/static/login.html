<html lang="en">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="/static/style.css?v=6">
<title>Flip Reader</title>

<body>
<form class="login card-box" method="post" action="/login">
  <h1 class="brand"><span class="mark">F</span> Flip Reader</h1>

  <button class="primary" type="submit">Sign in</button>
</form>
